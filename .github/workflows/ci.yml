name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    env:
      APPHUB_ASSET_REPOSITORY: ${{ github.repository }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject submitted generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(git diff --name-status "$BASE_SHA" HEAD -- .generated)
          invalid=$(printf '%s\n' "$changes" | grep -Ev '^D[[:space:]]+\.generated/media/[a-f0-9]{64}\.webp$' || true)
          if test -n "$invalid"; then
            echo "Do not submit generated changes."
            echo "$invalid"
            exit 1
          fi

      - name: Generate changed applications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/generate-changed-apps.sh "$BASE_SHA"

      - name: Validate
        env:
          APPHUB_ALLOW_UNPUBLISHED_MEDIA: "1"
        run: pnpm run validate
