name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".generated/**"
  schedule:
    - cron: "7 4 * * 1-6"
    - cron: "7 4 * * 0"
  workflow_dispatch:

permissions: {}

env:
  APPHUB_REFRESH_NETWORK_REPORT: /tmp/apphub-refresh-network.json
  APPHUB_REFRESH_REPORT: /tmp/apphub-refresh-report.json
  APPHUB_REFRESH_STATE: /tmp/apphub-refresh-state.json

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture refresh state
        if: github.event_name != 'push'
        run: bun scripts/refresh-report.ts capture

      - name: Refresh changed applications
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/generate-changed-apps.sh "$BASE_SHA"

      - name: Refresh releases and statistics
        if: github.event.schedule == '7 4 * * 1-6'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run refresh-statistics

      - name: Refresh catalog and statistics
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 4 * * 0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run refresh-catalog

      - name: Create refresh report
        if: always() && github.event_name != 'push'
        run: bun scripts/refresh-report.ts report

      - name: Upload refresh report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: catalog-refresh-${{ github.run_id }}
          path: /tmp/apphub-refresh-report.json
          retention-days: 30

      - name: Validate generated catalog
        run: bun run validate:catalog

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit generated catalog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git

          git add .generated

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update generated catalog"
          git push

      - name: Build site
        env:
          BASE_PATH: /apphub
        run: bun run build

      - name: Validate site
        run: bun run validate:dist

      - name: Update Pages content
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git

          mv dist /tmp/apphub-dist

          if git fetch origin gh-pages; then
            git worktree add -B gh-pages /tmp/apphub-pages FETCH_HEAD
          else
            git worktree add --detach /tmp/apphub-pages
            cd /tmp/apphub-pages
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          cd /tmp/apphub-pages
          git clean -fdx

          for path in ./*; do
            if [ ! -f "$path/.pr-preview" ]; then
              rm -rf "$path"
            fi
          done

          cp -R /tmp/apphub-dist/. .
          touch .nojekyll

          git add --all

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git commit -m "deploy: update production site"
          git push origin gh-pages

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: /tmp/apphub-pages

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Check maintenance alerts
        if: always() && github.event_name != 'push'
        run: bun scripts/refresh-report.ts check
