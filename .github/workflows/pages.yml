name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".generated/**"
      - "revocations.json"
      - "trust/revocations.json"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPHUB_ASSET_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_call' && 'main' || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh changed applications
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/generate-changed-apps.sh "$BASE_SHA"

      - name: Validate generated catalog
        run: bun run validate:catalog

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write

      - name: Plan GitHub publication
        env:
          APPHUB_PUBLICATION_PLAN: /tmp/apphub-publication-plan.json
        run: bun run plan-github-publication

      - name: Publish immutable media
        env:
          APPHUB_PUBLICATION_PLAN: /tmp/apphub-publication-plan.json
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run publish-github-media

      - name: Write published snapshot
        run: bun scripts/write-snapshot.ts

      - name: Generate signed catalog
        env:
          APPHUB_TUF_SNAPSHOT_KEY: ${{ secrets.APPHUB_TUF_SNAPSHOT_KEY }}
          APPHUB_TUF_TARGETS_KEY: ${{ secrets.APPHUB_TUF_TARGETS_KEY }}
          APPHUB_TUF_TIMESTAMP_KEY: ${{ secrets.APPHUB_TUF_TIMESTAMP_KEY }}
        run: bun run generate-tuf

      - name: Validate published catalog
        run: bun run validate:catalog

      - name: Validate signed catalog
        run: bun run validate-tuf

      - name: Commit generated catalog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git

          git add .generated/apps .generated/downloads.json .generated/media-map.json .generated/snapshot.json .generated/star-etags.json .generated/stars.json
          if test -d .generated/tuf; then
            git add .generated/tuf
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated catalog"
          git push

      - name: Build site
        env:
          BASE_PATH: /apphub
        run: bun run build

      - name: Validate site
        run: bun run validate:dist

      - name: Prepare Pages artifact
        run: touch dist/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
