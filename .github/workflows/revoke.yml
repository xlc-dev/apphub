name: Revoke AppImage

on:
  schedule:
    - cron: "19 5 1 * *"
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 to revoke
        required: true
        type: string
      reason:
        description: Public reason for revocation
        required: true
        type: string

permissions: {}

concurrency:
  group: catalog-revocation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: catalog-revocation
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sign revocations
        env:
          APPHUB_REVOKE_REASON: ${{ inputs.reason }}
          APPHUB_REVOKE_SHA256: ${{ inputs.sha256 }}
          APPHUB_TUF_REVOCATIONS_KEY: ${{ secrets.APPHUB_TUF_REVOCATIONS_KEY }}
        run: bun run update-revocations

      - name: Validate signed revocations
        run: bun run validate-revocations

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish revocations
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git add revocations.json trust/revocations.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: publish artifact revocations"
          git push

  deploy:
    needs: publish
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
