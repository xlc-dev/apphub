name: Update catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run update-releases

      - name: Update download totals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run update-downloads

      - name: Validate changes
        run: bun run validate

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "chore: update catalog"
          title: "chore: update catalog"
          body: "Automated release metadata and download total updates."
          branch: catalog-update
          delete-branch: true
          add-paths: |
            apps
            catalog/downloads.json
