name: Update catalog

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore download history
        run: |
          if git fetch origin catalog-update && git cat-file -e origin/catalog-update:catalog/downloads.json; then
            git show origin/catalog-update:catalog/downloads.json > /tmp/apphub-downloads.json
            mv /tmp/apphub-downloads.json catalog/downloads.json
          fi

      - name: Update releases
        run: bun run update-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update download totals
        run: bun run update-downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate changes
        run: bun run validate

      - name: Verify artifact downloads
        run: bun run verify:downloads

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add 'apps/*/icon.png' 'apps/*/releases.json' catalog/downloads.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update catalog"
          REMOTE_COMMIT=$(git ls-remote --heads origin refs/heads/catalog-update | awk '{print $1}')
          if test -n "$REMOTE_COMMIT"; then
            git push --force-with-lease=refs/heads/catalog-update:"$REMOTE_COMMIT" origin HEAD:catalog-update
          else
            git push origin HEAD:catalog-update
          fi
          gh pr view catalog-update >/dev/null 2>&1 || gh pr create --head catalog-update --title "Update catalog" --body "Automated catalog update."
