name: Build PR preview

on:
  pull_request:

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      APPHUB_ASSET_REPOSITORY: ${{ github.repository }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate changed applications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/generate-changed-apps.sh "$BASE_SHA"

      - name: Build preview
        env:
          BASE_PATH: /apphub
        run: bun run build

      - name: Validate preview
        run: bun run validate:dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-${{ github.event.pull_request.head.sha }}
          path: dist
          retention-days: 7
