name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

env:
  PREVIEW_PATH: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.action != 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate changed applications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/generate-changed-apps.sh "$BASE_SHA"

      - name: Build preview
        env:
          BASE_PATH: /apphub/${{ env.PREVIEW_PATH }}
        run: bun run build

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview
          path: dist

      - name: Check out production
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: production
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install production dependencies
        working-directory: production
        run: bun install --frozen-lockfile

      - name: Build production
        env:
          BASE_PATH: /apphub
        working-directory: production
        run: bun run build

      - name: Upload production
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production
          path: production/dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: preview
      url: https://xlc-dev.github.io/apphub/${{ env.PREVIEW_PATH }}/
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download preview
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview
          path: /tmp/apphub-preview

      - name: Download production
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production
          path: /tmp/apphub-production

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Update Pages content
        env:
          PREVIOUS_PREVIEW: ${{ github.event.before }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git

          new_branch=false

          if git fetch origin gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            new_branch=true
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          git clean -fdx

          if [ "$new_branch" = true ]; then
            cp -R /tmp/apphub-production/. .
            touch .nojekyll
          fi

          if [ -n "$PREVIOUS_PREVIEW" ]; then
            rm -rf "$PREVIOUS_PREVIEW"
          fi

          mkdir -p "$PREVIEW_PATH"
          cp -R /tmp/apphub-preview/. "$PREVIEW_PATH"
          touch "$PREVIEW_PATH/.pr-preview"
          touch .nojekyll

          git add --all

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git commit -m "deploy: update preview for PR #${{ github.event.number }}"
          git push origin gh-pages

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy site
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  remove:
    if: >-
      github.event.action == 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Pages content
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Set up Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Remove preview
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git

          rm -rf "$PREVIEW_PATH"

          git add --all

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git commit -m "deploy: remove preview for PR #${{ github.event.number }}"
          git push origin gh-pages

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy site
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
